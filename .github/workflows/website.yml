name: Website

on:
    pull_request:
        paths:
            - "website/**"
            - ".github/workflows/website.yml"
    push:
        branches: [main]
        paths:
            - "website/**"
            - ".github/workflows/website.yml"
    release:
        types: [published]
    schedule:
        - cron: "17 * * * *"
    workflow_dispatch:
        inputs:
            deploy:
                description: "Deploy the website to GitHub Pages"
                required: true
                type: boolean
                default: false

permissions:
    contents: read

defaults:
    run:
        shell: bash
        working-directory: website

jobs:
    verify:
        if: >-
            github.event_name == 'pull_request' ||
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && !inputs.deploy)
        concurrency:
            group: website-verify-${{ github.ref }}
            cancel-in-progress: true
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: website/package-lock.json
            - run: npm ci
            - run: npm run build
            - run: npm run check
            - run: npm run test:sites

    release-refresh:
        if: >-
            github.event_name == 'release' &&
            github.repository == 'areal-project/AReaL-Harness' &&
            vars.WEBSITE_AUTO_DEPLOY == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        permissions:
            actions: write
        steps:
            - name: Refresh website from the default branch
              working-directory: ${{ github.workspace }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: gh workflow run website.yml --repo "$GH_REPO" --ref "$DEFAULT_BRANCH" --field deploy=true

    deploy:
        if: >-
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
            ((github.event_name == 'schedule' && vars.WEBSITE_AUTO_DEPLOY == 'true') ||
            (github.event_name == 'workflow_dispatch' && inputs.deploy))
        concurrency:
            group: website-pages-${{ github.repository }}
            cancel-in-progress: false
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: website/package-lock.json
            - run: npm ci
            - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
              with:
                  enablement: false
            - name: Refresh official release catalog
              run: npm run refresh:releases
              env:
                  GH_TOKEN: ${{ github.token }}
            - run: npm run build
            - run: npm run check
            - run: npm run test:sites
            - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
              with:
                  path: website/dist/client
            - name: Deploy GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
