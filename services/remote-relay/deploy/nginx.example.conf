worker_processes 1;
pid /tmp/nginx.pid;
# NGINX 错误日志可能包含 URL；本片段不保留请求日志。
error_log /dev/null;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_req_zone $server_name zone=requests:1m rate=200r/s;
    limit_conn_zone $server_name zone=connections:1m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }
    server {
        listen 8443 ssl;
        server_name remote.example.org;
        ssl_certificate /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        # 精确 Host 必须与 Relay publicOrigin 匹配，包括端口形式。
        if ($http_host != "remote.example.org") { return 444; }
        limit_req zone=requests burst=200 nodelay;
        limit_conn connections 256;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
